<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频静音分割器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
            color: white;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .upload-area {
            border: 3px dashed #4f46e5;
            border-radius: 20px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.03);
        }

        .upload-area:hover {
            border-color: #818cf8;
            background: rgba(255, 255, 255, 0.06);
        }

        .upload-area.dragover {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.1);
        }

        .upload-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #64748b;
            font-size: 0.9rem;
        }

        .file-info {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }

        .file-info.show {
            display: block;
        }

        .file-info h3 {
            margin-bottom: 10px;
            color: #a855f7;
        }

        .file-details {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .settings {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-top: 25px;
            display: none;
        }

        .settings.show {
            display: block;
        }

        .settings h3 {
            margin-bottom: 20px;
            color: #a855f7;
        }

        .setting-item {
            margin-bottom: 20px;
        }

        .setting-item label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        .setting-item select,
        .setting-item input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #334155;
            border-radius: 10px;
            background: #1e293b;
            color: white;
            font-size: 1rem;
        }

        .setting-item select:focus,
        .setting-item input:focus {
            outline: none;
            border-color: #818cf8;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .btn-primary {
            background: linear-gradient(90deg, #7c3aed, #db2777);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #334155;
            color: white;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .progress {
            margin-top: 25px;
            display: none;
        }

        .progress.show {
            display: block;
        }

        .progress-bar {
            height: 8px;
            background: #1e293b;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #a855f7);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            margin-top: 10px;
            color: #94a3b8;
        }

        .results {
            margin-top: 30px;
            display: none;
        }

        .results.show {
            display: block;
        }

        .results h2 {
            margin-bottom: 20px;
            color: #22c55e;
        }

        .segments-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .segment-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .segment-info {
            flex: 1;
        }

        .segment-name {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .segment-time {
            color: #64748b;
            font-size: 0.9rem;
        }

        .download-btn {
            padding: 8px 16px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .download-btn:hover {
            background: #2563eb;
        }

        .download-all {
            margin-top: 20px;
        }

        .hidden {
            display: none;
        }

        input[type="file"] {
            display: none;
        }

        audio {
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 音频静音分割器</h1>
            <p>纯前端版本 - 无需服务器，直接在浏览器中运行</p>
        </div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">点击或拖放上传音频文件</div>
            <div class="upload-hint">支持 MP3, WAV, OGG, MP4 等格式</div>
            <input type="file" id="fileInput" accept="audio/*,video/mp4">
        </div>

        <div class="file-info" id="fileInfo">
            <h3>📄 文件信息</h3>
            <div class="file-details" id="fileDetails"></div>
            <audio id="audioPreview" controls class="hidden"></audio>
        </div>

        <div class="settings" id="settings">
            <h3>⚙️ 设置</h3>
            
            <div class="setting-item">
                <label for="noiseThreshold">静音检测阈值 (dB)</label>
                <select id="noiseThreshold">
                    <option value="-50">非常敏感 (-50 dB)</option>
                    <option value="-40">敏感 (-40 dB)</option>
                    <option value="-30" selected>默认 (-30 dB)</option>
                    <option value="-20">不敏感 (-20 dB)</option>
                    <option value="-10">非常不敏感 (-10 dB)</option>
                </select>
            </div>

            <div class="setting-item">
                <label for="minSilence">最小静音时长 (秒)</label>
                <input type="number" id="minSilence" min="0.1" step="0.1" value="0.5">
            </div>

            <div class="setting-item">
                <label for="outputFormat">输出格式</label>
                <select id="outputFormat">
                    <option value="wav" selected>WAV (无损)</option>
                    <option value="mp3">MP3</option>
                </select>
            </div>

            <button class="btn btn-primary" id="processBtn" disabled>
                🔪 开始分割音频
            </button>
            
            <button class="btn btn-secondary" id="resetBtn">
                🔄 重新上传
            </button>
        </div>

        <div class="progress" id="progress">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">准备中...</div>
        </div>

        <div class="results" id="results">
            <h2>✅ 处理完成！</h2>
            <div class="segments-list" id="segmentsList"></div>
            
            <button class="btn btn-primary download-all" id="downloadAllBtn">
                📦 下载全部 (ZIP)
            </button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        let audioBuffer = null;
        let audioContext = null;
        let segments = [];
        let currentFile = null;

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileDetails = document.getElementById('fileDetails');
        const audioPreview = document.getElementById('audioPreview');
        const settings = document.getElementById('settings');
        const processBtn = document.getElementById('processBtn');
        const resetBtn = document.getElementById('resetBtn');
        const progress = document.getElementById('progress');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const results = document.getElementById('results');
        const segmentsList = document.getElementById('segmentsList');
        const downloadAllBtn = document.getElementById('downloadAllBtn');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        async function handleFile(file) {
            currentFile = file;
            segments = [];
            
            fileDetails.innerHTML = `
                <strong>文件名：</strong>${file.name}<br>
                <strong>大小：</strong>${(file.size / (1024 * 1024)).toFixed(2)} MB<br>
                <strong>类型：</strong>${file.type || '未知'}
            `;
            fileInfo.classList.add('show');

            const url = URL.createObjectURL(file);
            audioPreview.src = url;
            audioPreview.classList.remove('hidden');

            settings.classList.add('show');
            processBtn.disabled = true;
            results.classList.remove('show');

            try {
                await loadAudio(file);
                processBtn.disabled = false;
            } catch (error) {
                alert('无法加载音频文件: ' + error.message);
            }
        }

        async function loadAudio(file) {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            const arrayBuffer = await file.arrayBuffer();
            audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
        }

        function detectSilences(buffer, thresholdDb, minSilenceSeconds) {
            const channelData = buffer.getChannelData(0);
            const sampleRate = buffer.sampleRate;
            const minSilenceSamples = minSilenceSeconds * sampleRate;
            const threshold = Math.pow(10, thresholdDb / 20);

            const silences = [];
            let silenceStart = null;
            let silentSamples = 0;

            for (let i = 0; i < channelData.length; i++) {
                const sample = Math.abs(channelData[i]);
                
                if (sample < threshold) {
                    if (silenceStart === null) {
                        silenceStart = i;
                    }
                    silentSamples++;
                } else {
                    if (silenceStart !== null && silentSamples >= minSilenceSamples) {
                        silences.push({
                            start: silenceStart / sampleRate,
                            end: i / sampleRate
                        });
                    }
                    silenceStart = null;
                    silentSamples = 0;
                }
            }

            if (silenceStart !== null && silentSamples >= minSilenceSamples) {
                silences.push({
                    start: silenceStart / sampleRate,
                    end: channelData.length / sampleRate
                });
            }

            return silences;
        }

        function getSoundSegments(silences, duration) {
            const soundSegments = [];
            let prevEnd = 0;
            let index = 1;

            for (const silence of silences) {
                if (silence.start > prevEnd) {
                    soundSegments.push({
                        start: prevEnd,
                        end: silence.start,
                        index: index++
                    });
                }
                prevEnd = silence.end;
            }

            if (prevEnd < duration) {
                soundSegments.push({
                    start: prevEnd,
                    end: duration,
                    index: index++
                });
            }

            return soundSegments;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            const ms = Math.floor((seconds % 1) * 100);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}.${ms.toString().padStart(2, '0')}`;
        }

        async function extractSegment(buffer, start, end) {
            const sampleRate = buffer.sampleRate;
            const startSample = Math.floor(start * sampleRate);
            const endSample = Math.floor(end * sampleRate);
            const length = endSample - startSample;

            const newBuffer = audioContext.createBuffer(
                buffer.numberOfChannels,
                length,
                sampleRate
            );

            for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
                const sourceData = buffer.getChannelData(channel);
                const destData = newBuffer.getChannelData(channel);
                for (let i = 0; i < length; i++) {
                    destData[i] = sourceData[startSample + i];
                }
            }

            return newBuffer;
        }

        function audioBufferToWav(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const format = 1;
            const bitDepth = 16;

            const bytesPerSample = bitDepth / 8;
            const blockAlign = numChannels * bytesPerSample;

            const dataLength = buffer.length * blockAlign;
            const bufferLength = 44 + dataLength;
            const arrayBuffer = new ArrayBuffer(bufferLength);
            const view = new DataView(arrayBuffer);

            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };

            writeString(0, 'RIFF');
            view.setUint32(4, bufferLength - 8, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, format, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * blockAlign, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitDepth, true);
            writeString(36, 'data');
            view.setUint32(40, dataLength, true);

            let offset = 44;
            for (let i = 0; i < buffer.length; i++) {
                for (let channel = 0; channel < numChannels; channel++) {
                    const sample = Math.max(-1, Math.min(1, buffer.getChannelData(channel)[i]));
                    const value = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                    view.setInt16(offset, value, true);
                    offset += 2;
                }
            }

            return new Blob([arrayBuffer], { type: 'audio/wav' });
        }

        async function processAudio() {
            if (!audioBuffer) return;

            processBtn.disabled = true;
            progress.classList.add('show');
            results.classList.remove('show');
            segments = [];

            const thresholdDb = parseInt(document.getElementById('noiseThreshold').value);
            const minSilence = parseFloat(document.getElementById('minSilence').value);

            progressText.textContent = '正在检测静音片段...';
            progressFill.style.width = '20%';

            const silences = detectSilences(audioBuffer, thresholdDb, minSilence);
            
            progressText.textContent = '正在识别有声音的片段...';
            progressFill.style.width = '40%';

            const soundSegments = getSoundSegments(silences, audioBuffer.duration);

            if (soundSegments.length === 0) {
                alert('没有检测到有声音的片段！');
                progress.classList.remove('show');
                processBtn.disabled = false;
                return;
            }

            progressText.textContent = `正在提取 ${soundSegments.length} 个音频片段...`;
            progressFill.style.width = '60%';

            const segmentBlobs = [];
            for (let i = 0; i < soundSegments.length; i++) {
                const seg = soundSegments[i];
                const segmentBuffer = await extractSegment(audioBuffer, seg.start, seg.end);
                const wavBlob = audioBufferToWav(segmentBuffer);
                
                segments.push({
                    ...seg,
                    blob: wavBlob,
                    name: `segment_${String(seg.index).padStart(3, '0')}.wav`
                });

                progressFill.style.width = `${60 + (i / soundSegments.length) * 35}%`;
                progressText.textContent = `正在处理片段 ${i + 1}/${soundSegments.length}...`;
            }

            progressFill.style.width = '100%';
            progressText.textContent = '处理完成！';

            setTimeout(() => {
                progress.classList.remove('show');
                displayResults();
            }, 500);
        }

        function displayResults() {
            results.classList.add('show');
            segmentsList.innerHTML = '';

            segments.forEach(segment => {
                const div = document.createElement('div');
                div.className = 'segment-item';
                div.innerHTML = `
                    <div class="segment-info">
                        <div class="segment-name">${segment.name}</div>
                        <div class="segment-time">${formatTime(segment.start)} - ${formatTime(segment.end)}</div>
                    </div>
                    <button class="download-btn" data-index="${segment.index - 1}">
                        ⬇️ 下载
                    </button>
                `;
                segmentsList.appendChild(div);
            });

            document.querySelectorAll('.download-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const index = parseInt(e.target.dataset.index);
                    downloadSegment(index);
                });
            });
        }

        function downloadSegment(index) {
            const segment = segments[index];
            const url = URL.createObjectURL(segment.blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = segment.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        async function downloadAll() {
            if (segments.length === 0) return;

            downloadAllBtn.disabled = true;
            downloadAllBtn.textContent = '正在打包...';

            const zip = new JSZip();

            segments.forEach(segment => {
                zip.file(segment.name, segment.blob);
            });

            const content = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(content);
            const a = document.createElement('a');
            a.href = url;
            a.download = `audio_segments_${Date.now()}.zip`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            downloadAllBtn.disabled = false;
            downloadAllBtn.textContent = '📦 下载全部 (ZIP)';
        }

        function reset() {
            currentFile = null;
            audioBuffer = null;
            segments = [];
            fileInput.value = '';
            fileInfo.classList.remove('show');
            settings.classList.remove('show');
            results.classList.remove('show');
            progress.classList.remove('show');
            audioPreview.classList.add('hidden');
            audioPreview.src = '';
        }

        processBtn.addEventListener('click', processAudio);
        resetBtn.addEventListener('click', reset);
        downloadAllBtn.addEventListener('click', downloadAll);
    </script>
</body>
</html>
