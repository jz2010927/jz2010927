<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片转换与压缩工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3b82f6',
            secondary: '#10b981',
            light: '#f3f4f6',
            dark: '#1f2937'
          },
          fontFamily: {
            inter: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .upload-area-active {
        @apply border-primary bg-blue-50;
      }
      .transition-all-300 {
        @apply transition-all duration-300 ease-in-out;
      }
    }
  </style>
</head>
<body class="bg-gray-50 font-inter text-dark min-h-screen">
  <div class="container mx-auto px-4 py-8 max-w-6xl">
    <!-- Header -->
    <header class="text-center mb-12">
      <h1 class="text-4xl font-bold text-primary mb-2">图片转换与压缩工具</h1>
      <p class="text-gray-600">批量处理图片格式转换和智能压缩</p>
    </header>

    <!-- Main Content -->
    <main>
      <!-- Upload Section -->
      <section class="bg-white rounded-lg shadow-md p-6 mb-8">
        <h2 class="text-xl font-semibold mb-4">上传图片</h2>
        <div 
          id="upload-area" 
          class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center cursor-pointer transition-all-300"
        >
          <div class="flex flex-col items-center justify-center">
            <i data-lucide="upload" class="w-12 h-12 text-gray-400 mb-4"></i>
            <p class="text-gray-600 mb-2">拖拽图片到此处或点击上传</p>
            <p class="text-sm text-gray-500 mb-4">支持PNG、BMP、JPG、JPEG、AVIF、HEIC、HEIF、SVG、WebP等格式，可选择是否跳过已是目标格式的图片，单次最多处理2000张图片</p>
            <input 
              type="file" 
              id="file-input" 
              class="hidden" 
              multiple 
              accept=".png,.bmp,.jpg,.jpeg,.avif,.heic,.heif,.svg,.webp"
            >
            <button 
              id="upload-btn" 
              class="bg-primary hover:bg-blue-600 text-white font-medium py-2 px-6 rounded-md transition-all-300"
            >
              选择图片
            </button>
          </div>
        </div>
      </section>

      <!-- Settings Section -->
      <section class="bg-white rounded-lg shadow-md p-6 mb-8">
        <h2 class="text-xl font-semibold mb-4">功能设置</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">压缩质量</label>
            <div class="flex items-center">
              <input 
                type="range" 
                id="quality-slider" 
                min="10" 
                max="100" 
                value="90" 
                class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
              >
              <span id="quality-value" class="ml-4 text-sm font-medium text-primary">90%</span>
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">目标格式</label>
            <select 
              id="target-format" 
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary"
            >
              <option value="webp">WebP</option>
              <option value="png">PNG</option>
              <option value="jpeg">JPEG</option>
              <option value="bmp">BMP</option>
            </select>
          </div>
          <div class="md:col-span-2">
            <label class="inline-flex items-center cursor-pointer">
              <input
                type="checkbox"
                id="skip-same-format"
                checked
                class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary"
              >
              <span class="ml-2 text-sm font-medium text-gray-700">跳过与目标格式相同的文件</span>
            </label>
            <p class="mt-1 text-xs text-gray-500">取消勾选后，相同格式的图片也会重新处理；仅超过尺寸限制时才会等比例缩小。</p>
          </div>
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-2">尺寸限制</label>
            <div class="flex items-center space-x-4">
              <div class="flex-1">
                <label class="block text-xs text-gray-500 mb-1">宽度</label>
                <input 
                  type="number" 
                  id="width-limit" 
                  value="4096" 
                  min="100" 
                  max="8192" 
                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary"
                >
              </div>
              <span class="text-sm text-gray-500">×</span>
              <div class="flex-1">
                <label class="block text-xs text-gray-500 mb-1">高度</label>
                <input 
                  type="number" 
                  id="height-limit" 
                  value="4096" 
                  min="100" 
                  max="8192" 
                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary"
                >
              </div>
            </div>
          </div>
        </div>
        <div class="mt-6 text-center">
          <button 
            id="process-btn" 
            class="bg-primary hover:bg-blue-600 text-white font-medium py-2 px-6 rounded-md transition-all-300 disabled:bg-gray-300 disabled:cursor-not-allowed"
            disabled
          >
            开始处理
          </button>
        </div>
      </section>

      <!-- Results Section -->
      <section class="bg-white rounded-lg shadow-md p-6 mb-8">
        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-4">
          <h2 class="text-xl font-semibold">处理结果</h2>
          <div class="flex flex-col sm:flex-row gap-2">
            <button 
              id="download-compressed-btn" 
              class="bg-primary hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-md transition-all-300 disabled:bg-gray-300 disabled:cursor-not-allowed"
              disabled
            >
              一键下载所有已压缩的
            </button>
            <button 
              id="download-all-btn" 
              class="bg-secondary hover:bg-green-600 text-white font-medium py-2 px-4 rounded-md transition-all-300 disabled:bg-gray-300 disabled:cursor-not-allowed"
              disabled
            >
              一键下载所有
            </button>
          </div>
        </div>
        <div id="results-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
          <!-- Results will be dynamically added here -->
        </div>
        <div id="empty-results" class="text-center py-12 text-gray-500">
          <i data-lucide="image" class="w-12 h-12 mx-auto mb-4 text-gray-300"></i>
          <p>暂无处理结果</p>
        </div>
        <div id="pagination-container" class="mt-6 flex flex-col sm:flex-row items-center justify-between gap-4 hidden">
          <!-- Pagination controls will be dynamically added here -->
        </div>
      </section>
    </main>
  </div>

  <script>
    // Wait for DOM to load
    document.addEventListener('DOMContentLoaded', function() {
      console.log('DOM loaded');
      // Initialize Lucide icons
      lucide.createIcons();

      // Global variables
      let selectedFiles = [];
      let processedFiles = [];
      let quality = 90;
      let widthLimit = 4096;
      let heightLimit = 4096;
      let targetFormat = 'webp';
      let skipSameFormat = true;
      let currentPage = 1;
      const itemsPerPage = 25;
      
      // Supported formats map
      const formatMap = {
        'webp': { mime: 'image/webp', ext: '.webp' },
        'png': { mime: 'image/png', ext: '.png' },
        'jpeg': { mime: 'image/jpeg', ext: '.jpg' },
        'bmp': { mime: 'image/bmp', ext: '.bmp' }
      };

      // DOM elements
      const uploadArea = document.getElementById('upload-area');
      const fileInput = document.getElementById('file-input');
      const uploadBtn = document.getElementById('upload-btn');
      const qualitySlider = document.getElementById('quality-slider');
      const qualityValue = document.getElementById('quality-value');
      const targetFormatSelect = document.getElementById('target-format');
      const skipSameFormatInput = document.getElementById('skip-same-format');
      const widthLimitInput = document.getElementById('width-limit');
      const heightLimitInput = document.getElementById('height-limit');
      const processBtn = document.getElementById('process-btn');
      const downloadCompressedBtn = document.getElementById('download-compressed-btn');
      const downloadAllBtn = document.getElementById('download-all-btn');
      const resultsContainer = document.getElementById('results-container');
      const emptyResults = document.getElementById('empty-results');
      const paginationContainer = document.getElementById('pagination-container');
      
      console.log('DOM elements:', {
        uploadArea: !!uploadArea,
        fileInput: !!fileInput,
        uploadBtn: !!uploadBtn,
        qualitySlider: !!qualitySlider,
        qualityValue: !!qualityValue,
        targetFormatSelect: !!targetFormatSelect,
        skipSameFormatInput: !!skipSameFormatInput,
        widthLimitInput: !!widthLimitInput,
        heightLimitInput: !!heightLimitInput,
        processBtn: !!processBtn,
        downloadCompressedBtn: !!downloadCompressedBtn,
        downloadAllBtn: !!downloadAllBtn,
        resultsContainer: !!resultsContainer,
        emptyResults: !!emptyResults,
        paginationContainer: !!paginationContainer
      });

      // Drag and drop handlers
      function handleDragOver(e) {
        e.preventDefault();
        uploadArea.classList.add('upload-area-active');
      }

      function handleDragLeave(e) {
        e.preventDefault();
        uploadArea.classList.remove('upload-area-active');
      }

      function handleDrop(e) {
        e.preventDefault();
        uploadArea.classList.remove('upload-area-active');
        const files = Array.from(e.dataTransfer.files);
        handleFiles(files);
      }

      // File selection handler
      function handleFileSelect(e) {
        const files = Array.from(e.target.files);
        handleFiles(files);
      }

      // Get file format from filename
      function getFileFormat(filename) {
        const ext = filename.substring(filename.lastIndexOf('.') + 1).toLowerCase();
        if (ext === 'jpg') return 'jpeg';
        return ext;
      }
      
      // Handle files
      function handleFiles(files) {
        // Filter image files
        const imageFiles = files.filter(file => {
          return file.type.startsWith('image/');
        });
        
        // Check file count limit
        if (imageFiles.length > 2000) {
          alert('单次最多处理2000张图片');
          return;
        }
        
        selectedFiles = imageFiles;
        updateUI();
      }

      // Update UI based on selected files
      function updateUI() {
        if (selectedFiles.length > 0) {
          processBtn.disabled = false;
          uploadArea.classList.add('border-secondary', 'bg-green-50');
          const uploadContent = uploadArea.querySelector('div');
          uploadContent.innerHTML = `
            <i data-lucide="check-circle" class="w-12 h-12 text-secondary mb-4"></i>
            <p class="text-secondary font-medium mb-2">已选择 ${selectedFiles.length} 张图片</p>
            <p class="text-sm text-gray-500">点击重新选择</p>
          `;
          lucide.createIcons();
        } else {
          processBtn.disabled = true;
          uploadArea.classList.remove('border-secondary', 'bg-green-50');
          const uploadContent = uploadArea.querySelector('div');
          uploadContent.innerHTML = `
            <i data-lucide="upload" class="w-12 h-12 text-gray-400 mb-4"></i>
            <p class="text-gray-600 mb-2">拖拽图片到此处或点击上传</p>
            <p class="text-sm text-gray-500">支持PNG、BMP、JPG、JPEG、AVIF、HEIC、HEIF、SVG、WebP等格式，可选择是否跳过已是目标格式的图片，单次最多处理2000张图片</p>
          `;
          lucide.createIcons();
        }
      }

      // Quality change handler
      function handleQualityChange(e) {
        quality = parseInt(e.target.value);
        qualityValue.textContent = `${quality}%`;
      }

      // Target format change handler
      function handleTargetFormatChange(e) {
        targetFormat = e.target.value;
      }

      // Same-format skip setting handler
      function handleSkipSameFormatChange(e) {
        skipSameFormat = e.target.checked;
      }

      // Width limit change handler
      function handleWidthLimitChange(e) {
        widthLimit = parseInt(e.target.value);
        if (isNaN(widthLimit) || widthLimit < 100) {
          widthLimit = 100;
          e.target.value = 100;
        } else if (widthLimit > 8192) {
          widthLimit = 8192;
          e.target.value = 8192;
        }
      }

      // Height limit change handler
      function handleHeightLimitChange(e) {
        heightLimit = parseInt(e.target.value);
        if (isNaN(heightLimit) || heightLimit < 100) {
          heightLimit = 100;
          e.target.value = 100;
        } else if (heightLimit > 8192) {
          heightLimit = 8192;
          e.target.value = 8192;
        }
      }

      // Process files
      async function processFiles() {
        if (selectedFiles.length === 0) return;
        
        processBtn.disabled = true;
        processBtn.textContent = '处理中...';
        downloadAllBtn.disabled = true;
        downloadCompressedBtn.disabled = true;
        
        processedFiles = [];
        currentPage = 1;
        resultsContainer.innerHTML = '';
        emptyResults.classList.add('hidden');
        paginationContainer.classList.add('hidden');
        
        // Process files in batches to avoid blocking the UI
        const batchSize = 10;
        for (let i = 0; i < selectedFiles.length; i += batchSize) {
          const batch = selectedFiles.slice(i, i + batchSize);
          await Promise.all(batch.map(processFile));
        }
        
        // Render first page
        if (processedFiles.length > 0) {
          renderResults();
          paginationContainer.classList.remove('hidden');
          renderPagination();
        }
        
        processBtn.textContent = '开始处理';
        processBtn.disabled = false;
        downloadAllBtn.disabled = processedFiles.length === 0;
        downloadCompressedBtn.disabled = !processedFiles.some(file => calculateSizeReduction(file) > 0);
      }

      // Process individual file
      async function processFile(file) {
        return new Promise((resolve) => {
          // Get file format
          const fileFormat = getFileFormat(file.name);
          
          // Skip same-format files only when the option is enabled
          if (skipSameFormat && fileFormat === targetFormat) {
            const processedFile = {
              id: Date.now() + Math.random(),
              originalFile: file,
              originalSize: file.size,
              processedFile: file,
              processedSize: file.size,
              outputFormat: formatMap[targetFormat].mime,
              outputExtension: formatMap[targetFormat].ext,
              status: 'skipped'
            };
            processedFiles.push(processedFile);
            resolve();
            return;
          }
          
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              // Create canvas for resizing and conversion
              const canvas = document.createElement('canvas');
              const ctx = canvas.getContext('2d');
              
              // Calculate new dimensions while maintaining aspect ratio
              let width = img.width;
              let height = img.height;
              
              if (width > widthLimit || height > heightLimit) {
                const ratio = Math.min(widthLimit / width, heightLimit / height);
                width *= ratio;
                height *= ratio;
              }
              
              canvas.width = width;
              canvas.height = height;
              
              // Draw image on canvas
              ctx.drawImage(img, 0, 0, width, height);
              
              // Determine output format
              const outputFormat = formatMap[targetFormat].mime;
              const outputExtension = formatMap[targetFormat].ext;
              
              // Convert with quality setting
              canvas.toBlob((blob) => {
                // Optimize file size if needed
                optimizeFileSize(blob, file.name, outputFormat).then(optimizedBlob => {
                  const processedFile = {
                    id: Date.now() + Math.random(),
                    originalFile: file,
                    originalSize: file.size,
                    processedFile: optimizedBlob,
                    processedSize: optimizedBlob.size,
                    outputFormat: outputFormat,
                    outputExtension: outputExtension,
                    status: 'completed'
                  };
                  
                  processedFiles.push(processedFile);
                  resolve();
                });
              }, outputFormat, quality / 100);
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      // Get file extension
      function getFileExtension(filename) {
        return filename.substring(filename.lastIndexOf('.'));
      }

      // Optimize file size to be under 100KB
      async function optimizeFileSize(blob, fileName, outputFormat) {
        if (blob.size <= 100 * 1024) {
          return blob;
        }
        
        // Create image from blob
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Try lower quality first
            let currentQuality = quality / 100;
            
            const optimize = () => {
              canvas.width = img.width;
              canvas.height = img.height;
              ctx.drawImage(img, 0, 0);
              
              canvas.toBlob((newBlob) => {
                if (newBlob.size <= 100 * 1024 || currentQuality <= 0.1) {
                  resolve(newBlob);
                } else {
                  currentQuality -= 0.1;
                  optimize();
                }
              }, outputFormat, currentQuality);
            };
            
            optimize();
          };
          img.src = URL.createObjectURL(blob);
        });
      }

      // Create result card element
      function calculateSizeReduction(file) {
        return Math.round((1 - file.processedSize / file.originalSize) * 100);
      }

      function createResultCard(file) {
        const resultCard = document.createElement('div');
        resultCard.className = 'border border-gray-200 rounded-lg p-4';
        
        const originalSize = formatFileSize(file.originalSize);
        const processedSize = formatFileSize(file.processedSize);
        const sizeReduction = calculateSizeReduction(file);
        const progressWidth = Math.min(Math.abs(sizeReduction), 100);
        const isSizeIncrease = sizeReduction < 0;
        const reductionTextClass = isSizeIncrease ? 'text-red-600' : 'text-green-600';
        const progressBarClass = isSizeIncrease ? 'bg-red-500' : 'bg-secondary';
        const outputFormat = file.outputFormat.split('/')[1].toUpperCase();
        
        if (file.status === 'skipped') {
          resultCard.innerHTML = `
            <div class="flex justify-between items-start mb-2">
              <h3 class="font-medium text-sm truncate" title="${file.originalFile.name}">${file.originalFile.name}</h3>
              <button class="download-btn text-primary hover:text-blue-600" data-id="${file.id}">
                <i data-lucide="download" class="w-4 h-4"></i>
              </button>
            </div>
            <div class="flex items-center gap-2 text-yellow-600">
              <i data-lucide="info" class="w-4 h-4"></i>
              <span class="text-sm font-medium">已是目标格式，已跳过</span>
            </div>
          `;
        } else {
          resultCard.innerHTML = `
            <div class="flex justify-between items-start mb-2">
              <h3 class="font-medium text-sm truncate" title="${file.originalFile.name}">${file.originalFile.name}</h3>
              <button class="download-btn text-primary hover:text-blue-600" data-id="${file.id}">
                <i data-lucide="download" class="w-4 h-4"></i>
              </button>
            </div>
            <div class="flex gap-2 mb-3">
              <div class="flex-1">
                <p class="text-xs text-gray-500">原图</p>
                <p class="text-sm font-medium">${originalSize}</p>
              </div>
              <div class="flex-1">
                <p class="text-xs text-gray-500">${outputFormat}</p>
                <p class="text-sm font-medium text-secondary">${processedSize}</p>
              </div>
              <div class="flex-1">
                <p class="text-xs text-gray-500">节省</p>
                <p class="text-sm font-medium ${reductionTextClass}">${sizeReduction}%</p>
              </div>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-1.5">
              <div class="${progressBarClass} h-1.5 rounded-full" style="width: ${progressWidth}%"></div>
            </div>
          `;
        }
        
        // Add download event listener
        const downloadBtn = resultCard.querySelector('.download-btn');
        downloadBtn.addEventListener('click', () => downloadFile(file));
        
        return resultCard;
      }

      // Render results for current page
      function renderResults() {
        resultsContainer.innerHTML = '';
        
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const currentItems = processedFiles.slice(startIndex, endIndex);
        
        currentItems.forEach(file => {
          const resultCard = createResultCard(file);
          resultsContainer.appendChild(resultCard);
        });
        
        lucide.createIcons();
      }

      // Render pagination controls
      function renderPagination() {
        const totalPages = Math.ceil(processedFiles.length / itemsPerPage);
        
        if (totalPages <= 1) {
          paginationContainer.classList.add('hidden');
          return;
        }
        
        paginationContainer.classList.remove('hidden');
        
        let html = `
          <div class="text-sm text-gray-600">
            第 ${currentPage} 页 / 共 ${totalPages} 页 (共 ${processedFiles.length} 个结果)
          </div>
          <div class="flex items-center gap-2">
            <button id="prev-btn" class="px-3 py-1.5 border border-gray-300 rounded-md text-sm font-medium hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed" ${currentPage === 1 ? 'disabled' : ''}>
              上一页
            </button>
            <div class="flex gap-1" id="page-numbers">
              ${renderPageNumbers(totalPages)}
            </div>
            <button id="next-btn" class="px-3 py-1.5 border border-gray-300 rounded-md text-sm font-medium hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed" ${currentPage === totalPages ? 'disabled' : ''}>
              下一页
            </button>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-sm text-gray-600">跳转到</span>
            <input type="number" id="go-to-page" min="1" max="${totalPages}" value="${currentPage}" class="w-20 px-2 py-1.5 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-primary">
            <button id="go-btn" class="px-3 py-1.5 bg-primary text-white rounded-md text-sm font-medium hover:bg-blue-600">
              跳转
            </button>
          </div>
        `;
        
        paginationContainer.innerHTML = html;
        
        // Add event listeners
        document.getElementById('prev-btn').addEventListener('click', goToPrevPage);
        document.getElementById('next-btn').addEventListener('click', goToNextPage);
        document.getElementById('go-btn').addEventListener('click', goToPage);
        document.getElementById('go-to-page').addEventListener('keypress', (e) => {
          if (e.key === 'Enter') goToPage();
        });
        
        // Add click listeners to page numbers
        const pageNumberButtons = paginationContainer.querySelectorAll('.page-number-btn');
        pageNumberButtons.forEach(btn => {
          btn.addEventListener('click', () => {
            currentPage = parseInt(btn.dataset.page);
            renderResults();
            renderPagination();
          });
        });
      }

      // Render page number buttons
      function renderPageNumbers(totalPages) {
        let html = '';
        const maxVisible = 5;
        let start = Math.max(1, currentPage - Math.floor(maxVisible / 2));
        let end = Math.min(totalPages, start + maxVisible - 1);
        
        if (end - start + 1 < maxVisible) {
          start = Math.max(1, end - maxVisible + 1);
        }
        
        if (start > 1) {
          html += `<button class="page-number-btn px-3 py-1.5 border border-gray-300 rounded-md text-sm font-medium hover:bg-gray-50" data-page="1">1</button>`;
          if (start > 2) {
            html += `<span class="px-1 text-gray-400">...</span>`;
          }
        }
        
        for (let i = start; i <= end; i++) {
          const isActive = i === currentPage;
          html += `<button class="page-number-btn px-3 py-1.5 border rounded-md text-sm font-medium ${isActive ? 'bg-primary text-white border-primary' : 'border-gray-300 hover:bg-gray-50'}" data-page="${i}">${i}</button>`;
        }
        
        if (end < totalPages) {
          if (end < totalPages - 1) {
            html += `<span class="px-1 text-gray-400">...</span>`;
          }
          html += `<button class="page-number-btn px-3 py-1.5 border border-gray-300 rounded-md text-sm font-medium hover:bg-gray-50" data-page="${totalPages}">${totalPages}</button>`;
        }
        
        return html;
      }

      // Go to previous page
      function goToPrevPage() {
        if (currentPage > 1) {
          currentPage--;
          renderResults();
          renderPagination();
        }
      }

      // Go to next page
      function goToNextPage() {
        const totalPages = Math.ceil(processedFiles.length / itemsPerPage);
        if (currentPage < totalPages) {
          currentPage++;
          renderResults();
          renderPagination();
        }
      }

      // Go to specific page
      function goToPage() {
        const input = document.getElementById('go-to-page');
        const page = parseInt(input.value);
        const totalPages = Math.ceil(processedFiles.length / itemsPerPage);
        
        if (!isNaN(page) && page >= 1 && page <= totalPages) {
          currentPage = page;
          renderResults();
          renderPagination();
        } else {
          input.value = currentPage;
        }
      }

      // Download individual file
      function downloadFile(file) {
        const url = URL.createObjectURL(file.processedFile);
        const a = document.createElement('a');
        a.href = url;
        const originalName = file.originalFile.name;
        const baseName = originalName.substring(0, originalName.lastIndexOf('.'));
        a.download = baseName + file.outputExtension;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      // Download selected files as zip
      async function downloadFilesAsZip(files, archivePrefix) {
        if (files.length === 0) return;

        const zip = new JSZip();
        
        for (const file of files) {
          const originalName = file.originalFile.name;
          const baseName = originalName.substring(0, originalName.lastIndexOf('.'));
          const fileName = baseName + file.outputExtension;
          zip.file(fileName, file.processedFile);
        }
        
        zip.generateAsync({ type: 'blob' }).then((blob) => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${archivePrefix}-${Date.now()}.zip`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        });
      }

      // Download every processing result
      function downloadAllFiles() {
        return downloadFilesAsZip(processedFiles, 'processed-images');
      }

      // Download only files whose displayed compression rate is greater than 0%
      function downloadCompressedFiles() {
        const compressedFiles = processedFiles.filter(file => calculateSizeReduction(file) > 0);
        return downloadFilesAsZip(compressedFiles, 'compressed-images');
      }

      // Format file size
      function formatFileSize(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
      }

      // Event listeners
      console.log('Binding event listeners...');
      uploadArea.addEventListener('click', (e) => {
        // 防止点击上传按钮时触发
        if (!e.target.closest('#upload-btn')) {
          console.log('Upload area clicked');
          fileInput.click();
        }
      });
      uploadBtn.addEventListener('click', () => {
        console.log('Upload button clicked');
        fileInput.click();
      });
      uploadArea.addEventListener('dragover', handleDragOver);
      uploadArea.addEventListener('dragleave', handleDragLeave);
      uploadArea.addEventListener('drop', handleDrop);
      fileInput.addEventListener('change', handleFileSelect);
      qualitySlider.addEventListener('input', (e) => {
        console.log('Slider input event:', e.target.value);
        handleQualityChange(e);
      });
      qualitySlider.addEventListener('change', (e) => {
        console.log('Slider change event:', e.target.value);
        handleQualityChange(e);
      });
      targetFormatSelect.addEventListener('change', handleTargetFormatChange);
      skipSameFormatInput.addEventListener('change', handleSkipSameFormatChange);
      widthLimitInput.addEventListener('change', handleWidthLimitChange);
      heightLimitInput.addEventListener('change', handleHeightLimitChange);
      processBtn.addEventListener('click', processFiles);
      downloadCompressedBtn.addEventListener('click', downloadCompressedFiles);
      downloadAllBtn.addEventListener('click', downloadAllFiles);
      console.log('Event listeners bound');
      
      // Test slider value
      console.log('Initial slider value:', qualitySlider.value);
    });
  </script>
</body>
</html>
